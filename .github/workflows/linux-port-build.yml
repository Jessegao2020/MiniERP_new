name: Linux Port Build

on:
  workflow_dispatch:
  push:
    branches:
      - linux-port
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Avalonia desktop project
        run: dotnet restore Desktop/MiniERP.Desktop.Avalonia/MiniERP.Desktop.Avalonia.csproj

      - name: Build Avalonia desktop project
        run: dotnet build Desktop/MiniERP.Desktop.Avalonia/MiniERP.Desktop.Avalonia.csproj --configuration Release --no-restore

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 8.0.22

      - name: Verify database migrations
        run: |
          rm -f erp.db
          dotnet ef database update \
            --project Infrastructure/MiniERP.Infrastructure/MiniERP.Infrastructure.csproj \
            --startup-project Desktop/MiniERP.Desktop.Avalonia/MiniERP.Desktop.Avalonia.csproj

      - name: Verify quotation PDF renderer
        run: |
          mkdir -p .ci-pdf-smoke
          cat > .ci-pdf-smoke/PdfSmoke.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="../Desktop/MiniERP.Desktop.Avalonia/MiniERP.Desktop.Avalonia.csproj" />
            </ItemGroup>
          </Project>
          EOF
          cat > .ci-pdf-smoke/Program.cs <<'EOF'
          using MiniERP.Desktop.Infrastructure;
          using MiniERP.Domain;

          var quotation = new Quotation
          {
              QuotationNumber = "PDF-SMOKE",
              QuotationDate = DateTime.Today,
              ValidUntil = DateTime.Today.AddDays(14),
              Currency = "USD",
              ExchangeRate = 7m,
              CustomerNameSnapshot = "Test Customer",
              CustomerContactSnapshot = "Mr. Test",
              SalesContactNameSnapshot = "Jesse Gao",
              SalesContactPhoneSnapshot = "+86 155 3125 2057",
              SalesContactEmailSnapshot = "jesse@forlinx.com",
              DeliveryTerm = "FCA Baoding",
              LeadTime = "8 weeks",
              Tier1Label = "100 Sets",
              Tier2Label = "500 Sets",
              Tier3Label = "1000 Sets",
              Items = new List<QuotationItem>
              {
                  new()
                  {
                      ArticleName = "FET3588J-C System on Module",
                      Description = "Processor: Rockchip RK3588J",
                      Specification = "8GB LPDDR5, 64GB eMMC",
                      Unit = "PCS",
                      Quantity = 100,
                      UnitPrice = 510,
                      Quantity2 = 500,
                      UnitPrice2 = 510,
                      Quantity3 = 1000,
                      UnitPrice3 = 510,
                      Currency = "USD",
                      ExchangeRateSnapshot = 7m
                  }
              }
          };

          using var stream = File.Create("quotation-smoke.pdf");
          QuotationPdfExporter.Export(quotation, stream);
          EOF
          dotnet run --project .ci-pdf-smoke/PdfSmoke.csproj --configuration Release
          test -s quotation-smoke.pdf
          rm -rf .ci-pdf-smoke quotation-smoke.pdf
