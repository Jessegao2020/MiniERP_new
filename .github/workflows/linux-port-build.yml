name: Linux Port Build

on:
  workflow_dispatch:
  push:
    branches:
      - linux-port
      - feature/sales-documents
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Avalonia desktop project
        run: dotnet restore Desktop/MiniERP.Desktop.Avalonia/MiniERP.Desktop.Avalonia.csproj

      - name: Build Avalonia desktop project
        run: dotnet build Desktop/MiniERP.Desktop.Avalonia/MiniERP.Desktop.Avalonia.csproj --configuration Release --no-restore

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 8.0.22

      - name: Sync contract model snapshot
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[sync-contract-snapshot]')
        run: |
          dotnet ef migrations add SyncContractSnapshotTemp \
            --project Infrastructure/MiniERP.Infrastructure/MiniERP.Infrastructure.csproj \
            --startup-project Desktop/MiniERP.Desktop.Avalonia/MiniERP.Desktop.Avalonia.csproj \
            --output-dir Migrations
          find Infrastructure/MiniERP.Infrastructure/Migrations -maxdepth 1 -type f \
            \( -name '*_SyncContractSnapshotTemp.cs' -o -name '*_SyncContractSnapshotTemp.Designer.cs' \) -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Infrastructure/MiniERP.Infrastructure/Migrations/ApplicationDbContextModelSnapshot.cs
          if ! git diff --cached --quiet; then
            git commit -m "Sync EF model snapshot for contracts"
            git push
          fi

      - name: Verify database migrations
        run: |
          rm -f erp.db
          dotnet ef database update \
            --project Infrastructure/MiniERP.Infrastructure/MiniERP.Infrastructure.csproj \
            --startup-project Desktop/MiniERP.Desktop.Avalonia/MiniERP.Desktop.Avalonia.csproj

      - name: Verify model snapshot is current
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project Infrastructure/MiniERP.Infrastructure/MiniERP.Infrastructure.csproj \
            --startup-project Desktop/MiniERP.Desktop.Avalonia/MiniERP.Desktop.Avalonia.csproj
